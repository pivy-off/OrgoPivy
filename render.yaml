services:
  - type: web
    name: orgopivy-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
